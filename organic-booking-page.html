        * {

        /* Booking Container */
        .booking-container {
            min-height: 100vh;
            padding: 3rem 2rem;
            background: linear-gradient(135deg, #07204A 0%, #0a2a5a 100%);
        }

        .booking-content {
            max-width: 1000px;
            margin: 0 auto;
        }

        /* Success Icon */
        .success-icon {
            width: 80px;
            height: 80px;
            background-color: #CFAF6E;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 2rem auto;
            color: #07204A;
            font-size: 2.5rem;
            font-weight: bold;
            animation: scaleIn 0.5s ease-out;
        }

        /* Typography */
        .booking-title {
            font-family: 'Merriweather', serif;
            font-size: clamp(2rem, 5vw, 2.5rem);
            font-weight: 700;
            color: #F5F5DC;
            text-align: center;
            margin-bottom: 1rem;
            line-height: 1.2;
        }

        .booking-subtitle {
            font-size: clamp(1.1rem, 2.5vw, 1.3rem);
            color: #CFAF6E;
            font-weight: 600;
            text-align: center;
            margin-bottom: 3rem;
        }

        /* Calendly Inline Widget */
        .calendly-inline-widget {
            min-width: 320px;
            height: 700px;
        }

        /* Animation */
        @keyframes scaleIn {
            from {
                opacity: 0;
                transform: scale(0.5);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            .booking-container {
                padding: 2rem 1rem;
            }

            .calendly-inline-widget {
                height: 800px;
            }

            .success-icon {
                width: 70px;
                height: 70px;
                font-size: 2rem;
            }
        }
